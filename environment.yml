name: fc-mh
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.9
  - scikit-learn>=1.2
  - statsmodels>=0.13
  - joblib>=1.3
  - nibabel>=4.0
  - nilearn>=0.10
  - matplotlib>=3.5
  - tqdm
  - h5py
  - pip:
    # Not on conda-forge; must be installed via pip
    - neuroHarmonize>=2.0
    - kneed>=0.8
    - pyls @ git+https://github.com/netneurolab/pypyls.git

# R dependencies (install manually or via renv):
#   tidyverse, readxl, readr, psych
